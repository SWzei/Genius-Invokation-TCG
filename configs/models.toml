# 模型档案（D29）。本文件不含任何密钥：api_key_env 只写“环境变量名”，
# 密钥放在进程环境或仓库根目录的 .env（已在 .gitignore 内）。
# 个人改动写到 configs/models.local.toml（不入库）或 $GITCG_MODELS_CONFIG 指向的文件，同名档案覆盖本文件。
#
# 内置档案（无需配置）：mock / mock:first / mock:last / mock:random / mock:invalid / mock:error
#   —— 离线占位模型，用来联调与测试，不调用任何 API。
# 用法：策略 spec `llm:<档案名>`；临时换模型 `llm:<档案名>#model=<模型 id>`。
#
# 字段：provider（决定协议、默认地址与密钥变量名）、model（必填，以服务商当前文档为准）、
#   temperature（写 "none" 表示不发送该参数）、max_tokens、max_tokens_param、timeout、retries、
#   json_mode、extra_body（原样并入请求体，如推理强度）、price_in / price_out（每百万 token 价格，
#   自行填写后才会统计成本）、[profiles.<名>.budget] max_calls / max_tokens / max_cost。
# provider 可选：openai | anthropic(claude) | gemini | gemini-native | deepseek | glm(zhipu)
#   | openai-compatible（自建/本地/网关，需写 base_url）| mock

[profiles.deepseek-chat]
provider = "deepseek"            # DEEPSEEK_API_KEY
model = "deepseek-chat"           # 2026-11 起服务端路由到 DeepSeek-V4.1-Flash（非思考）；新实验用下方 deepseek-flash*
temperature = 0.0
max_tokens = 512

[profiles.claude-haiku]
provider = "anthropic"           # ANTHROPIC_API_KEY
model = "claude-haiku-5-5"
temperature = 0.0
max_tokens = 512

[profiles.claude-sonnet]
provider = "anthropic"
model = "claude-sonnet-5-5"
temperature = 0.0
max_tokens = 512

# 以下三家的模型 id 更新频繁：取消注释并按服务商当前文档填写 model。
#
# [profiles.openai]
# provider = "openai"            # OPENAI_API_KEY
# model = "<模型 id>"
# max_tokens_param = "max_completion_tokens"   # 新模型用这个参数名；写错时客户端会自动改用一次
# temperature = "none"           # 推理类模型不接受 temperature 时这样写
# max_tokens = 1024
#
# [profiles.gemini]
# provider = "gemini"            # GEMINI_API_KEY 或 GOOGLE_API_KEY；走官方 OpenAI 兼容端点
# model = "<模型 id>"            # 原生 generateContent 协议用 provider = "gemini-native"
# max_tokens = 1024
#
# [profiles.local]
# provider = "openai-compatible" # vLLM / Ollama / LM Studio / 自建网关
# base_url = "http://127.0.0.1:8000/v1"
# model = "<模型名>"
# api_key_env = ""               # 不需要密钥；需要时写变量名
# json_mode = false              # 服务不支持 response_format 时关闭
#
# 带预算与成本统计的例子：
# [profiles.deepseek-budget]
# provider = "deepseek"
# model = "deepseek-chat"
# price_in = 0.0                 # 每百万输入 token 的价格（自行填写）
# price_out = 0.0
# currency = "CNY"
# [profiles.deepseek-budget.budget]
# max_calls = 300
# max_cost = 5.0

# ---------------------------------------------------------------------------
# 智谱 GLM（open.bigmodel.cn）。模型 id 于 2026-11-14 用真实接口核对过（见
# reports/review/2026-11_glm_validation.md）。密钥：ZAI_API_KEY 或 ZHIPUAI_API_KEY。
# - GLM-4.5 及以后的模型默认开启"思考"：思考 token 计入输出并占用 max_tokens，
#   max_tokens 偏小时会得到空回复（finish_reason=length）。逐步决策用 thinking=disabled；
#   要比较思考的效果，用 *-think 档案（max_tokens 留足）。
# - 价格取自 docs.z.ai 的美元价目表（每百万 token），仅用于估算；bigmodel.cn 以人民币
#   计费，实际账单以控制台为准。免费模型价格记 0。
# - 余额不足时接口返回 HTTP 429 + 错误码 1113：客户端归为 quota，不重试，并停止后续请求。
# ---------------------------------------------------------------------------
[profiles.glm-flash]
provider = "glm"
model = "glm-4.7-flash"          # 免费档
max_tokens = 512
timeout = 90
retries = 4
price_in = 0.0
price_out = 0.0
extra_body = { thinking = { type = "disabled" } }

[profiles.glm-flash-think]
provider = "glm"
model = "glm-4.7-flash"
max_tokens = 4096
timeout = 180
retries = 4
price_in = 0.0
price_out = 0.0
extra_body = { thinking = { type = "enabled" } }

[profiles.glm-4-flash]
provider = "glm"
model = "glm-4-flash"            # 旧一代免费档，无思考
max_tokens = 512
timeout = 90
retries = 4
price_in = 0.0
price_out = 0.0

# GLM-5.3 系列"始终思考"：thinking.type=disabled 会被拒绝（HTTP 400，错误码 1210）。
# 用顶层 reasoning_effort = "low" | "high" | "max" 控制思考强度；思考 token 计入输出，
# 所以 max_tokens 要留足。
[profiles.glm-53-flash]
provider = "glm"
model = "glm-5.3-flash"
max_tokens = 4096
timeout = 180
retries = 4
price_in = 0.15
price_cached_in = 0.03
price_out = 0.50
extra_body = { reasoning_effort = "low" }

[profiles.glm-53]
provider = "glm"
model = "glm-5.3"                # 旗舰；按量计费端点
max_tokens = 4096
timeout = 240
retries = 4
price_in = 1.40
price_cached_in = 0.26
price_out = 4.40
extra_body = { reasoning_effort = "low" }

# Coding Plan 套餐端点（包月额度，不按 token 计费）。官方文档说明该端点面向 Coding Agent；
# 是否用于其他用途由账户所有者决定。价格字段填的是按量计费的公开价，只用于给出
# "等价成本"，不是实际账单。
[profiles.glm-53-plan]
provider = "glm"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
model = "glm-5.3"
max_tokens = 2048
timeout = 240
retries = 4
price_in = 1.40
price_cached_in = 0.26
price_out = 4.40
extra_body = { reasoning_effort = "low" }

[profiles.glm-53-plan-high]
provider = "glm"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
model = "glm-5.3"
max_tokens = 8192
timeout = 300
retries = 4
price_in = 1.40
price_cached_in = 0.26
price_out = 4.40
extra_body = { reasoning_effort = "high" }

[profiles.glm-53-flash-plan]
provider = "glm"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
model = "glm-5.3-flash"
max_tokens = 4096
timeout = 180
retries = 4
price_in = 0.15
price_cached_in = 0.03
price_out = 0.50
extra_body = { reasoning_effort = "low" }

# ---------------------------------------------------------------------------
# DeepSeek-V4.1-Flash（api.deepseek.com）。模型 id 于 2026-11-21 用 /models 接口核对：
# `deepseek-flash`（name = DeepSeek-V4.1-Flash，上下文 1M，最大输出 384K）。密钥：DEEPSEEK_API_KEY。
# - 默认开启思考（effort = high）。`thinking.type = disabled` 关闭；`reasoning_effort` 取 low / high / max。
#   思考模式下 temperature 无效（不报错）。
# - 价格（美元 / 百万 token）分时段：下表填的是**非高峰**价；高峰（北京时间工作日 09:00–12:00、14:00–18:00，
#   即 UTC 01:00–04:00、06:00–10:00）为两倍。账单以控制台为准。
# - 用量字段与 OpenAI 一致：prompt_tokens_details.cached_tokens、completion_tokens_details.reasoning_tokens。
# ---------------------------------------------------------------------------
[profiles.deepseek-flash]
provider = "deepseek"
model = "deepseek-flash"
temperature = 0.0
max_tokens = 512
timeout = 120
retries = 4
price_in = 0.15
price_cached_in = 0.003
price_out = 0.60
extra_body = { thinking = { type = "disabled" } }

[profiles.deepseek-flash-think]
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 4096
timeout = 240
retries = 4
price_in = 0.15
price_cached_in = 0.003
price_out = 0.60
extra_body = { thinking = { type = "enabled" }, reasoning_effort = "low" }

# ---- D38：小模型（KB 提升对比）。价格为按公开价目估算，实际以账单为准；免费层不扣费但有速率限制。
