# 知识配置档案（D29）。决定哪些知识可以进入模型的提示词；`none`（不注入）为内置档案。
# 知识库位置：环境变量 GITCG_KB_DIR，或在档案里写 kb_root。
# 个人改动写到 configs/knowledge.local.toml（不入库）或 $GITCG_KNOWLEDGE_CONFIG。
# 用法：策略 spec `llm:<模型档案>#kb=<本文件的档案名>`。
#
# 四类来源在提示词里分块标注，互不混用：
#   rules            规则知识库条目 —— 事实；默认只收证据含「官方」或「引擎」的条目
#   strategy         策略知识库单元 —— 观点（未经验证），附知识库自带的置信度
#   expert_examples  脚本专家的决策记录（supervision.jsonl）—— 行为，不保证最优
#   custom           自定义 Markdown/TXT；文件头必须声明 kind: rule 或 kind: strategy，否则拒收

[profiles.rules]
rules = true

[profiles.strategy]
strategy = true

[profiles.rules-strategy]
rules = true
strategy = true

# 只用高置信度策略单元的例子：
# [profiles.rules-strategy-high]
# rules = true
# strategy = true
# strategy_confidence = ["高", "中–高"]
#
# 加专家对局示例与自定义资料的例子：
# [profiles.full]
# rules = true
# strategy = true
# expert_examples = ["data/evidence/<tag>/supervision.jsonl"]
# custom = ["data/knowledge/custom"]
# max_chars = 4000

# 2026-11-21：策略单元以"结论 + 关键变量 + 局限"呈现（单元的实质内容），其余同 rules-strategy。
# 用于区分"知识库内容有没有用"与"当前的简短呈现有没有用"，见 reports/review/2026-11_deepseek_kb.md。
[profiles.rules-strategy-full]
rules = true
strategy = true
strategy_detail = "full"
strategy_chars = 600
max_chars = 4800

# ---------------------------------------------------------------------------
# 2026-11-21 知识接入优化的阶段配置（D32，见 reports/review/2026-11_kb_training.md）。
# 每个阶段只在前一阶段上加一项改动；kbt-s0 与 rules-strategy 设置相同。
# ---------------------------------------------------------------------------
[profiles.kbt-s0]
rules = true
strategy = true

# S1：规则按局面检索（BM25，查询 = 合法选项 + 公开局面），替代按行动类型的固定映射
[profiles.kbt-s1]
rules = true
strategy = true
rule_selection = "retrieve"

# S2：S1 + 在训练集行动决策中触发过于频繁（> 50%）的策略单元不注入；每次最多 2 个
[profiles.kbt-s2]
rules = true
strategy = true
rule_selection = "retrieve"
unit_frequency_file = "configs/knowledge/unit_frequency_train.json"
max_unit_frequency = 0.5
max_strategy = 2

# S3：S2 + 训练集错误分析得出的针对性资料（只在"斩杀窗口"出现时注入）
[profiles.kbt-s3]
rules = true
strategy = true
rule_selection = "retrieve"
unit_frequency_file = "configs/knowledge/unit_frequency_train.json"
max_unit_frequency = 0.5
max_strategy = 2
custom = ["configs/knowledge/custom/lethal_window.md"]
custom_chars = 800

# S4：S3 + 情境触发规则（训练集错误分析：所需规则节几乎从未被选中；R03 §1 在对方已宣布结束时误导）。
# 对方已宣布结束 → R03 §3、R01 §4.3；对方出战角色有附着 → R06 §2、R06 §3.1；
# 我方召唤物 ≥ 3 → R07 §1；可使用技能 → R04 §3。触发的规则节优先，其余按检索补足，每次最多 4 节。
[profiles.kbt-s4]
rules = true
strategy = true
rule_selection = "retrieve"
rule_triggers = true
max_rules = 4
unit_frequency_file = "configs/knowledge/unit_frequency_train.json"
max_unit_frequency = 0.5
max_strategy = 2
custom = ["configs/knowledge/custom/lethal_window.md"]
custom_chars = 800

# ---------------------------------------------------------------------------
# D33 候选（预先登记，见 reports/review/2026-11_kb_d33_prereg.md）。只追加，不改 kbt-s0…s4。
# ---------------------------------------------------------------------------
# 精简：只保留规则（检索 + D32 情境触发），去掉策略单元与斩杀窗口资料。
[profiles.kbt3-lean]
rules = true
rule_selection = "retrieve"
rule_triggers = true
max_rules = 4

# 触发补全：kbt-s4 + "对方仍在行动（未宣布结束）且我方可宣布结束 → R01 §4.2"。
[profiles.kbt3-trig]
rules = true
strategy = true
rule_selection = "retrieve"
rule_triggers = true
rule_trigger_set = "d33"
max_rules = 4
unit_frequency_file = "configs/knowledge/unit_frequency_train.json"
max_unit_frequency = 0.5
max_strategy = 2
custom = ["configs/knowledge/custom/lethal_window.md"]
custom_chars = 800
